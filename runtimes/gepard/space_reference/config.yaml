# GEPARD Space configuration.
# Checkpoint, codec, preset speakers and generation defaults live here so the
# Space can be re-pointed at a new checkpoint / voices without code changes.

model:
  # Self-describing checkpoint (carries gepard_config.json). Private repos
  # are authorized via the HF_TOKEN Space secret.
  checkpoint: nineninesix/gepard-1.0
  attn_implementation: eager

codec:
  id: nvidia/nemo-nano-codec-22khz-1.89kbps-21.5fps
  sample_rate: 22050

# Preset voices: pre-encoded codec tokens (see gepard_inference/speakers.py).
# Paths are relative to this file. An entry is either `Name: path.pt` (the
# dropdown shows the key) or a mapping with `path` + a human-readable `label`.
speakers:
  Andrew:
    path: speakers/en_andrew.pt
    label: 🇺🇸 Andrew
  # Oakland English
  Marcus:
    path: speakers/en_oak.pt
    label: 🇺🇸 Marcus from Oakland
  # Boston English
  Sean:
    path: speakers/en_boston.pt
    label: 🇺🇸 Sean from Boston
  Tony:
    path: speakers/italian.pt
    label: 🇺🇸 Tony from Boston
  # Standard American English
  Emma:
    path: speakers/expresso_f.pt
    label: 🇺🇸 Emma
  Olivia:
    path: speakers/puck.pt
    label: 🇺🇸 Puck from Gemini
  Grace:
    path: speakers/nurisa.pt
    label: 🇺🇸 Grace
  Den:
    path: speakers/den.pt
    label: 🇺🇸 Den
  # Mexican Spanish
  Diego:
    path: speakers/mex_m.pt
    label: 🇲🇽 Diego from Mexico City
  Sofía:
    path: speakers/mx_f.pt
    label: 🇲🇽 Sofía from Guadalajara
  # Brazilian Portuguese
  Mateus:
    path: speakers/br_m.pt
    label: 🇧🇷 Mateus from Rio
  # Dutch
  Daan:
    path: speakers/nl_m.pt
    label: 🇳🇱 Daan from Amsterdam
  Sanne:
    path: speakers/nl_f.pt
    label: 🇳🇱 Sanne from Rotterdam
